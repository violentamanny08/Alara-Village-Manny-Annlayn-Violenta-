<style>
:root{--ink:#0C1310;--ink2:#131D18;--line:rgba(201,169,106,.28);--gold:#CDAE6F;--gold-d:#7A5C24;--ivory:#F5F0E6;--mute:#AAB5AA;--mute-d:#4A5A50;--pad:clamp(20px,5vw,72px)}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--ink);font-family:'Jost',system-ui,sans-serif;color:var(--ivory);-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:inherit;text-decoration:none}
h1,h2,h3,p,ul{margin:0}
ul{list-style:none;padding:0}
em{font-style:italic}
.serif{font-family:'Cormorant Garamond',serif}
.wrap{max-width:1296px;margin:0 auto}
.eyebrow{font-size:12px;letter-spacing:.34em;text-transform:uppercase;color:var(--gold)}
.eyebrow.d{color:var(--gold-d)}
.h2{font-family:'Cormorant Garamond',serif;font-weight:400;font-size:clamp(38px,5vw,66px);line-height:1.05;margin-top:20px}
.h2 em{color:var(--gold)}
.light{background:var(--ivory);color:var(--ink)}
.light .h2 em{color:var(--gold-d)}
section{padding:clamp(64px,9vw,128px) var(--pad)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:56px;padding:19px 34px;font-family:'Jost',sans-serif;font-size:12px;letter-spacing:.24em;text-transform:uppercase;font-weight:600;border:1px solid var(--gold);cursor:pointer;transition:background .25s,color .25s,transform .25s}
.btn:hover{transform:translateY(-2px)}
.btn-gold{background:var(--gold);color:var(--ink)}
.btn-gold:hover{background:#E3C98F}
.btn-ghost{background:transparent;color:var(--gold)}
.btn-ghost:hover{background:rgba(205,174,111,.12)}
.btn-dark{background:var(--ink);color:var(--gold);border-color:var(--ink)}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--gold);outline-offset:3px}

/* header */
header{position:relative;z-index:5;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:16px 32px;padding:26px var(--pad);border-bottom:1px solid var(--line)}
.brand{display:flex;flex-direction:column;gap:2px}
.brand b{font-family:'Cormorant Garamond',serif;font-size:26px;letter-spacing:.14em;font-weight:500;color:var(--ivory)}
.brand span{font-size:10px;letter-spacing:.42em;text-transform:uppercase;color:var(--gold)}
nav{display:flex;flex-wrap:wrap;align-items:center;gap:8px 34px;font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--mute)}
nav a:hover{color:var(--gold)}
nav .btn{min-height:44px;padding:13px 24px;font-weight:500}
nav .btn:hover{color:var(--gold)}

/* hero */
.hero{position:relative;padding-top:clamp(48px,8vw,110px);padding-bottom:clamp(56px,8vw,120px)}
.hero .wrap{position:relative;display:flex;flex-wrap:wrap;align-items:center;gap:56px}
.hero-copy{flex:1 1 480px;min-width:0}
.kicker{display:flex;align-items:center;gap:16px;font-size:12px;letter-spacing:.32em;text-transform:uppercase;color:var(--gold)}
.kicker i{width:56px;height:1px;background:var(--gold);display:block}
h1{font-family:'Cormorant Garamond',serif;font-weight:400;font-size:clamp(46px,7vw,96px);line-height:.98;letter-spacing:-.01em;margin-top:28px;color:var(--ivory)}
h1 em{color:var(--gold)}
.lead{margin-top:32px;max-width:520px;font-size:18px;line-height:1.75;font-weight:300;color:#C9D1C8}
.cta-row{margin-top:44px;display:flex;flex-wrap:wrap;gap:16px}
.fine{margin-top:28px;font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--mute)}
.hero-art{flex:1 1 380px;min-width:0;display:flex;justify-content:center}
.arch-wrap{position:relative;width:100%;max-width:470px;aspect-ratio:4/5.3}
.arch-wrap:before{content:"";position:absolute;inset:-18px;border:1px solid var(--line);border-radius:999px 999px 0 0}
.arch{position:absolute;inset:0;border-radius:999px 999px 0 0;overflow:hidden;border:1px solid var(--gold);background:linear-gradient(180deg,#1C2B23,#0F1A15)}
.arch svg{position:absolute;inset:0;width:100%;height:100%}
.arch:after{content:"";position:absolute;inset:0;background:radial-gradient(260px 260px at 50% 22%,rgba(205,174,111,.28),transparent 70%);pointer-events:none}

/* photo slots (image URL or placeholder) */
.slot{position:relative;background-size:cover;background-position:center;background-color:#16241D}
.slot .ph{position:absolute;left:0;right:0;bottom:26px;text-align:center;font-size:11px;letter-spacing:.32em;text-transform:uppercase;color:var(--gold);padding:0 16px}
.slot.has-img .ph{display:none}
.slot.has-img svg{display:none}
.res-img .slot.has-img:before{display:none}
.slot.has-img{background-size:cover !important;background-position:center !important;background-repeat:no-repeat !important}

/* strip */
.strip{border-top:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--ink2);padding:30px var(--pad)}
.strip .wrap{display:flex;flex-wrap:wrap;justify-content:space-between;gap:14px 28px;font-size:13px;letter-spacing:.26em;text-transform:uppercase;color:var(--mute)}
.strip i{font-style:normal;color:var(--gold)}

/* residences */
.center{text-align:center}
.tabs{margin-top:52px;display:flex;flex-wrap:wrap;justify-content:center;gap:8px 12px;border-bottom:1px solid rgba(12,19,16,.18)}
.tab{cursor:pointer;background:transparent;border:0;border-bottom:2px solid transparent;margin-bottom:-1px;padding:14px 22px;min-height:48px;font-family:'Jost',sans-serif;color:var(--mute-d)}
.tab b{font-family:'Cormorant Garamond',serif;font-size:30px;font-style:italic;font-weight:500}
.tab span{font-size:12px;letter-spacing:.14em;margin-left:8px}
.tab.on{color:var(--ink);border-bottom-color:var(--gold-d)}
.res{margin-top:56px;display:flex;flex-wrap:wrap;gap:56px;align-items:stretch}
.res-img{flex:1 1 440px;min-width:0}
.frame{border:1px solid rgba(122,92,36,.4);padding:8px;background:#FBF8F1}
.res-img .slot{aspect-ratio:16/9;display:flex;align-items:center;justify-content:center;overflow:hidden;background:linear-gradient(160deg,#1C2B23,#0F1A15)}
.res-img .slot:before{content:"";position:absolute;inset:14px;border:1px solid rgba(205,174,111,.3);pointer-events:none}
.res-img .big{font-family:'Cormorant Garamond',serif;font-size:clamp(64px,9vw,120px);font-style:italic;color:var(--gold);line-height:1;text-align:center}
.slot.has-img .big{display:none}
.note{margin-top:14px;font-size:12px;font-style:italic;color:var(--mute-d)}
.res-info{flex:1 1 380px;min-width:0;display:flex;flex-direction:column;justify-content:center}
.res-info h3{font-family:'Cormorant Garamond',serif;font-weight:400;font-size:clamp(48px,6vw,84px);line-height:1;margin-top:14px}
.tag{margin-top:12px;font-family:'Cormorant Garamond',serif;font-size:26px;font-style:italic;color:var(--gold-d)}
.blurb{margin-top:22px;font-size:17px;line-height:1.75;font-weight:300;color:#2B3A31}
.area{margin-top:30px;padding:22px 0;border-top:1px solid rgba(12,19,16,.18);border-bottom:1px solid rgba(12,19,16,.18);display:flex;align-items:baseline;gap:14px}
.area small{font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:var(--mute-d)}
.area b{font-family:'Cormorant Garamond',serif;font-size:36px;font-weight:400}
.feat{margin-top:24px;display:flex;flex-direction:column;gap:12px;font-size:15px;line-height:1.55;color:#2B3A31}
.feat li{display:flex;gap:14px}
.feat li:before{content:"◆";color:var(--gold-d)}
.res-info .btn{margin-top:34px;align-self:flex-start}


/* stacked homes */
.home{margin-top:clamp(40px,6vw,72px);padding-top:clamp(40px,6vw,72px);border-top:1px solid rgba(12,19,16,.18);scroll-margin-top:24px}
.home .res{margin-top:0;align-items:flex-start}
.home.rev .res{flex-direction:row-reverse}
.home .res-info{align-self:stretch}
.plan{margin-top:20px;border:1px solid rgba(122,92,36,.4);background:#FBF8F1}
.plan-h{padding:14px 18px;border-bottom:1px solid rgba(122,92,36,.25);font-size:11px;letter-spacing:.28em;text-transform:uppercase;color:var(--gold-d)}
.plan-b{aspect-ratio:16/9;background:#E9E3D3;background-position:center;background-repeat:no-repeat;background-size:cover;display:flex;align-items:center;justify-content:center;gap:5%;padding:6%}
.plan-b i{flex:1;height:100%;border:1px solid rgba(12,19,16,.25);display:flex;align-items:flex-end;justify-content:center;padding-bottom:10px;font-style:normal;font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--mute-d)}
.plan-b.has-img{padding:0}
.plan-b.has-img i{display:none}

/* living */
.cards{margin-top:64px;display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:32px}
.card{display:flex;flex-direction:column;gap:26px}
.card:nth-child(2){margin-top:48px}
.card .slot{aspect-ratio:3/4;border-radius:999px 999px 0 0;border:1px solid var(--line);overflow:hidden}
.card h3{font-family:'Cormorant Garamond',serif;font-weight:400;font-size:34px;line-height:1.1;margin-top:12px}
.card p{margin-top:14px;font-size:16px;line-height:1.75;font-weight:300;color:var(--mute)}
.card .eyebrow{font-size:11px;letter-spacing:.32em}

/* community */
.comm{background:var(--ink2);border-top:1px solid var(--line)}
.comm .wrap{display:flex;flex-wrap:wrap;gap:64px;align-items:center}
.comm-copy{flex:1 1 360px;min-width:0}
.comm-copy p{margin-top:24px;font-size:17px;line-height:1.75;font-weight:300;color:var(--mute)}
.feats{margin-top:32px;display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:0 24px}
.feats li{padding:16px 0;border-top:1px solid var(--line);font-size:13px;letter-spacing:.2em;text-transform:uppercase;color:var(--ivory)}
.comm-img{flex:1 1 440px;min-width:0}
.comm-img .slot{aspect-ratio:4/3;border:1px solid var(--gold);display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;background:linear-gradient(135deg,#1A2B22,#0E1914)}
.comm-img .slot:before{content:"";position:absolute;inset:14px;border:1px solid var(--line);pointer-events:none}
.comm-img .slot em{font-family:'Cormorant Garamond',serif;font-size:34px;color:var(--gold)}
.slot.has-img em{display:none}
.comm-img .note{color:var(--mute)}

/* process */
.steps{margin-top:72px;display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.step{padding:0 28px 8px 0;border-top:1px solid var(--gold-d)}
.step .n{font-family:'Cormorant Garamond',serif;font-size:88px;line-height:1;font-style:italic;color:var(--gold-d);margin-top:18px}
.step h3{margin-top:14px;font-size:15px;letter-spacing:.14em;text-transform:uppercase;font-weight:600}
.step p{margin-top:12px;font-size:15px;line-height:1.7;color:#2B3A31}

/* inquire */
.inq{position:relative}
.inq:before{content:"";position:absolute;inset:0;background:radial-gradient(800px 500px at 15% 20%,rgba(205,174,111,.12),transparent 70%)}
.inq .wrap{position:relative;display:flex;flex-wrap:wrap;gap:72px}
.inq-copy{flex:1 1 380px;min-width:0}
.inq-copy .h2{font-size:clamp(40px,5.4vw,72px);line-height:1.02}
.inq-copy>p{margin-top:26px;max-width:480px;font-size:17px;line-height:1.75;font-weight:300;color:var(--mute)}
.checks{margin-top:36px;border-bottom:1px solid var(--line)}
.checks li{padding:15px 0;border-top:1px solid var(--line);font-size:12px;letter-spacing:.24em;text-transform:uppercase}
.checks li:before{content:"✓";color:var(--gold);margin-right:14px}
.contacts{margin-top:36px;display:flex;flex-direction:column;gap:14px;font-size:16px}
.contacts a:hover{color:var(--gold)}
.contacts small{display:inline-block;width:84px;color:var(--gold);letter-spacing:.2em;font-size:11px;text-transform:uppercase}
.form-wrap{flex:1 1 400px;min-width:0}
.form{background:var(--ivory);color:var(--ink);padding:clamp(28px,4vw,52px);border:1px solid var(--gold);outline:1px solid rgba(205,174,111,.4);outline-offset:10px}
.form h3{font-family:'Cormorant Garamond',serif;font-weight:400;font-size:34px;line-height:1.1}
.form h3 em{color:var(--gold-d)}
.fields{margin-top:30px;display:flex;flex-direction:column;gap:24px}
.fields label{display:block;font-size:11px;letter-spacing:.28em;text-transform:uppercase;color:var(--gold-d)}
.fields input,.fields select,.fields textarea{width:100%;margin-top:6px;padding:12px 0;min-height:44px;border:0;border-bottom:1px solid var(--gold-d);border-radius:0;background:transparent;font-family:'Jost',sans-serif;font-size:17px;color:var(--ink)}
.fields textarea{resize:vertical;min-height:70px}
.form .btn{margin-top:34px;width:100%}
.form .btn[disabled]{opacity:.6;cursor:wait}
.micro{margin-top:16px;text-align:center;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--mute-d)}
.msg{margin-top:18px;text-align:center;font-size:15px;line-height:1.6}
.msg.ok{color:#1F5A3A}
.msg.err{color:#9B2C2C}
.success{display:none;text-align:center;padding:30px 0}
.success .serif{font-size:40px;line-height:1.1}
.success p{margin-top:16px;font-size:16px;line-height:1.7;color:#2B3A31}

/* ===== POPUP FORM (modal) ===== */
.modal{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;padding:20px;background:rgba(6,10,8,.82);backdrop-filter:blur(4px);overflow-y:auto}
.modal.open{display:flex;animation:mfade .25s ease}
@keyframes mfade{from{opacity:0}to{opacity:1}}
.modal .form{position:relative;width:100%;max-width:520px;margin:auto;animation:mrise .3s ease}
@keyframes mrise{from{transform:translateY(16px);opacity:0}to{transform:none;opacity:1}}
.modal-x{position:absolute;top:10px;right:14px;width:44px;height:44px;background:none;border:0;font-size:30px;line-height:1;color:var(--gold-d);cursor:pointer}
.modal-x:hover{color:var(--ink)}
body.modal-open{overflow:hidden}

footer{border-top:1px solid var(--line);padding:36px var(--pad);text-align:center;background:#09100D}
footer b{font-family:'Cormorant Garamond',serif;font-size:24px;letter-spacing:.14em;font-weight:500}
footer span{display:block;margin-top:6px;font-size:10px;letter-spacing:.42em;text-transform:uppercase;color:var(--gold)}
footer p{margin:22px auto 0;max-width:640px;font-size:12px;line-height:1.8;color:var(--mute)}

@media (max-width:700px){
  .card:nth-child(2){margin-top:0}
  .step{padding-right:0;padding-bottom:28px}
}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.btn{transition:none}}

@keyframes kb{from{transform:scale(1.04) translate3d(0,0,0)}to{transform:scale(1.1) translate3d(-2%,-1.5%,0)}}

@keyframes riseIn{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:none}}

@media (prefers-reduced-motion:reduce){.himg,.hsun,.hp,.rise{animation:none!important}}
/* ===== LOADING SCREEN ===== */
body.loading{overflow:hidden}
#loader{position:fixed;inset:0;z-index:1000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;padding:24px;text-align:center;background:var(--ink);color:var(--ivory);transition:opacity .8s ease,visibility .8s ease}
#loader.done{opacity:0;visibility:hidden;pointer-events:none}
#loader::before{content:"";position:absolute;inset:18px;border:1px solid var(--line);pointer-events:none}
.ld-alara{animation:ldIn 1s ease both}
.ld-alara img{display:block;max-width:min(300px,70vw);max-height:150px;width:auto;height:auto;margin:0 auto}
.ld-alara .ld-text{font-family:'Cormorant Garamond',serif;font-weight:400;font-size:clamp(46px,9vw,84px);letter-spacing:.2em;padding-left:.2em;line-height:1}
.ld-alara .ld-sub{margin-top:10px;font-size:11px;letter-spacing:.5em;padding-left:.5em;text-transform:uppercase;color:var(--gold)}
.ld-rule{width:70px;height:1px;background:var(--gold);margin:34px 0 26px;animation:ldGrow 1.2s .5s ease both}
.ld-by{font-size:10px;letter-spacing:.42em;padding-left:.42em;text-transform:uppercase;color:var(--mute);animation:ldIn 1s .7s ease both}
.ld-partners{margin-top:16px;animation:ldIn 1s .9s ease both}
.ld-partners img{display:block;max-width:min(240px,60vw);max-height:130px;width:auto;height:auto;margin:0 auto}
.ld-partners .ld-text{font-family:'Cormorant Garamond',serif;font-size:clamp(22px,4vw,30px);letter-spacing:.14em;color:var(--ivory)}
.ld-partners .ld-sub{margin-top:4px;font-size:10px;letter-spacing:.42em;padding-left:.42em;text-transform:uppercase;color:var(--gold)}
.ld-bar{position:relative;width:min(220px,50vw);height:2px;margin-top:44px;background:rgba(205,174,111,.2);overflow:hidden;animation:ldIn .8s 1s ease both}
.ld-bar i{position:absolute;inset:0;background:var(--gold);transform:scaleX(0);transform-origin:left;animation:ldBar 2.2s 1s cubic-bezier(.4,0,.2,1) forwards}
@keyframes ldIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes ldGrow{from{width:0;opacity:0}to{width:70px;opacity:1}}
@keyframes ldBar{to{transform:scaleX(1)}}
@media (prefers-reduced-motion:reduce){#loader *{animation-duration:.01s!important;animation-delay:0s!important}}
/* ===== PAIN POINTS ===== */
#pain{background:var(--ink2)}
.pain-grid{margin-top:64px;display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:0;border-top:1px solid var(--line);border-left:1px solid var(--line)}
.pain{padding:36px 30px 40px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);transition:background .3s}
.pain:hover{background:rgba(205,174,111,.06)}
.pain-n{font-family:'Cormorant Garamond',serif;font-size:42px;line-height:1;color:var(--gold)}
.pain h3{font-family:'Cormorant Garamond',serif;font-weight:400;font-size:clamp(24px,2.4vw,30px);line-height:1.15;margin-top:18px;color:var(--ivory)}
.pain q{display:block;margin-top:14px;font-family:'Cormorant Garamond',serif;font-style:italic;font-size:19px;color:var(--gold);quotes:"\201C" "\201D"}
.pain p{margin-top:14px;font-size:15px;line-height:1.7;color:var(--mute)}
.pain-end{margin:72px auto 0;max-width:720px;text-align:center}
.pain-end p{font-family:'Cormorant Garamond',serif;font-size:clamp(24px,3vw,34px);line-height:1.3;color:var(--ivory);margin-bottom:34px}
.pain-end p em{color:var(--gold)}
.pain-end .fine{margin-top:18px}
/* ===== PAIN ICONS ===== */
.pain-top{display:flex;justify-content:space-between;align-items:flex-start}
.pain-ico{width:46px;height:46px;fill:none;stroke:var(--gold);stroke-width:1.3;flex:none}
.pain-top .pain-n{color:rgba(205,174,111,.4)}
.pain:hover .pain-ico{stroke-width:1.6}
